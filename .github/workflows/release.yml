name: Release

# Push a tag like v0.2.0 whose version matches nws_weather_tui.__version__.
# See RELEASING.md for the one-time PyPI setup.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # Never run on forks: no releases or publishes from anyone's copy.
    if: github.repository == 'crinderneck/nws-weather-tui'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! -f "dist/nws_weather_tui-${version}-py3-none-any.whl" ]]; then
            echo "::error::Tag ${TAG} doesn't match the built version:"
            ls dist
            exit 1
          fi

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import importlib, pkgutil, nws_weather_tui as p; [importlib.import_module(m.name) for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')]"
          test -x /tmp/smoke/bin/nws-weather-tui

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.repository == 'crinderneck/nws-weather-tui'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nws-weather-tui/
    permissions:
      id-token: write # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # Independent of the pypi job, so a release still appears if PyPI isn't set up yet.
    needs: build
    if: github.repository == 'crinderneck/nws-weather-tui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
