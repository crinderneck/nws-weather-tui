[build-system]
# 77+ is needed for the SPDX `license = "MIT"` string (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nws-weather-tui"
dynamic = ["version"]
description = "A terminal-based weather application for the US, powered by the National Weather Service API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "crinderneck" },
]
keywords = ["weather", "tui", "curses", "nws", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "astral",
    "numpy",
    "pillow",
    "requests",
]

[project.optional-dependencies]
# Regression harness (tests/README.md). uv provides uvx for the Python 3.9 run;
# pyinstrument and time-machine are for the profiler, tests/profile_app.py.
test = ["pytest", "freezegun", "pyte", "vermin", "uv", "pyinstrument", "time-machine"]

[project.urls]
Homepage = "https://github.com/crinderneck/nws-weather-tui"
Repository = "https://github.com/crinderneck/nws-weather-tui"
Issues = "https://github.com/crinderneck/nws-weather-tui/issues"

[project.scripts]
nws-weather-tui = "nws_weather_tui.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Single source of truth for the version; the release workflow checks the tag matches it.
version = { attr = "nws_weather_tui.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs the fast suite (~3 s); `pytest -m slow` runs the Python 3.9
# and pipx checks, `pytest -m "slow or not slow"` everything.
addopts = "-m 'not slow'"
markers = ["slow: needs network, another Python or a pipx install"]
